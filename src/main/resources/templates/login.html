<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #a0a0c0;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0f0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: #f7971e;
            box-shadow: 0 0 10px rgba(247, 151, 30, 0.3);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.45);
            filter: brightness(1.1);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .tip {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h1>五子棋</h1>
    <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" value="admin">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" value="123456">
    </div>
    <button class="btn" id="loginBtn">登录</button>
    <div class="tip">测试账号：admin / 123456</div>
</div>

<script>
    // 登录按钮点击事件
    document.getElementById("loginBtn").onclick = async function() {
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        if (!username || !password) {
            alert("请输入用户名和密码！");
            return;
        }

        try {
            // 调用后端登录接口
            let res = await fetch("/api/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username: username, password: password})
            });

            let data = await res.json();

            if (data.code === 200) {
                // 登录成功：保存用户信息和token到本地
                localStorage.setItem("token", data.token || "");
                localStorage.setItem("user", JSON.stringify(data.user));
                alert("登录成功！");
                // 跳转到五子棋页面
                window.location.href = "/";
            } else {
                alert(data.msg || "登录失败！");
            }
        } catch (e) {
            alert("登录请求失败，请检查后端！");
            console.error(e);
        }
    };

    // 回车登录
    document.getElementById("password").onkeydown = function(e) {
        if (e.key === "Enter") {
            document.getElementById("loginBtn").click();
        }
    };
</script>
</body>
</html>
