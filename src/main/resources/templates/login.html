<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #a0a0c0;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0f0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input:focus {
            border-color: #f7971e;
            box-shadow: 0 0 10px rgba(247, 151, 30, 0.3);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.45);
            filter: brightness(1.1);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            box-shadow: 0 4px 12px rgba(56, 239, 125, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.45);
        }
        .tip {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
        .switch-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #a0a0c0;
        }
        .switch-link a {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
        }
        .switch-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .error-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #ff6b6b;
            min-height: 20px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h1>五子棋</h1>
    <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" value="admin">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" value="123456">
    </div>
    <div class="form-group" id="confirmPwdGroup" style="display:none;">
        <label>确认密码</label>
        <input type="password" id="confirmPwd" placeholder="请再次输入密码">
    </div>
    <button class="btn" id="actionBtn">登录</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="switch-link">
        <span id="switchText">还没有账号？</span>
        <a id="switchBtn">去注册</a>
    </div>
    <div class="tip" id="tipText">测试账号：admin / 123456</div>
</div>

<script>
    let isLoginMode = true;

    // 切换登录/注册模式
    document.getElementById("switchBtn").onclick = function() {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            document.getElementById("actionBtn").textContent = "登录";
            document.getElementById("switchText").textContent = "还没有账号？";
            document.getElementById("switchBtn").textContent = "去注册";
            document.getElementById("confirmPwdGroup").style.display = "none";
            document.getElementById("tipText").style.display = "block";
            document.getElementById("errorMsg").textContent = "";
        } else {
            document.getElementById("actionBtn").textContent = "注册";
            document.getElementById("switchText").textContent = "已有账号？";
            document.getElementById("switchBtn").textContent = "去登录";
            document.getElementById("confirmPwdGroup").style.display = "block";
            document.getElementById("tipText").style.display = "none";
            document.getElementById("errorMsg").textContent = "";
        }
    };

    // 主按钮点击事件（登录或注册）
    document.getElementById("actionBtn").onclick = async function() {
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;
        let errorMsg = document.getElementById("errorMsg");

        if (!username || !password) {
            errorMsg.textContent = "请输入用户名和密码！";
            return;
        }

        if (isLoginMode) {
            // ====== 登录 ======
            try {
                let res = await fetch("/api/login", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username: username, password: password})
                });

                let data = await res.json();

                if (data.code === 200) {
                    localStorage.setItem("token", data.token || "");
                    localStorage.setItem("user", JSON.stringify(data.user));
                    alert("登录成功！");
                    window.location.href = "/";
                } else {
                    errorMsg.textContent = data.msg || "登录失败！";
                }
            } catch (e) {
                errorMsg.textContent = "登录请求失败，请检查后端！";
                console.error(e);
            }
        } else {
            // ====== 注册 ======
            let confirmPwd = document.getElementById("confirmPwd").value;
            if (password !== confirmPwd) {
                errorMsg.textContent = "两次密码输入不一致！";
                return;
            }

            try {
                let res = await fetch("/api/register", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username: username, password: password})
                });

                let data = await res.json();

                if (data.code === 200) {
                    alert("注册成功！请登录");
                    // 切换到登录模式
                    document.getElementById("switchBtn").click();
                    document.getElementById("errorMsg").textContent = "";
                } else {
                    errorMsg.textContent = data.msg || "注册失败！";
                }
            } catch (e) {
                errorMsg.textContent = "注册请求失败，请检查后端！";
                console.error(e);
            }
        }
    };

    // 回车触发主按钮
    document.getElementById("password").onkeydown = function(e) {
        if (e.key === "Enter") {
            document.getElementById("actionBtn").click();
        }
    };
    document.getElementById("confirmPwd").onkeydown = function(e) {
        if (e.key === "Enter") {
            document.getElementById("actionBtn").click();
        }
    };
</script>
</body>
</html>
