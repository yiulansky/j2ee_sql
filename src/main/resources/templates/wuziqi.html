<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${projectName}">五子棋</title>
    <style>
        /* ========== 全局重置与基础 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
        }

        /* ========== 主容器 ========== */
        .container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px 40px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 560px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ========== 标题 & 用户信息 ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        .user-info {
            font-size: 14px;
            color: #a0a0c0;
        }
        .logout-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #fff;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            margin-left: 10px;
        }

        /* ========== 游戏信息栏 ========== */
        .info-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .info-bar p {
            font-size: 15px;
            color: #c0c0e0;
        }
        .info-bar span {
            font-weight: 600;
            color: #ffe484;
        }
        #winner {
            font-size: 18px;
            color: #ff6b6b !important;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 107, 107, 0.4);
        }

        /* ========== 玩家输入 ========== */
        .players {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .players label {
            font-size: 14px;
            color: #a0a0c0;
        }
        .players input {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #e0e0f0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            width: 110px;
        }
        .players input:focus {
            border-color: #f7971e;
            box-shadow: 0 0 10px rgba(247, 151, 30, 0.3);
        }
        .players input::placeholder {
            color: #666;
        }

        /* ========== 棋盘 ========== */
        .board-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(15, 32px);
            border-radius: 12px;
            padding: 10px;
            background: linear-gradient(145deg, #d4a24e, #b8863a, #d4a24e);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.5);
            border: 3px solid #8b6914;
        }
        .cell {
            width: 32px;
            height: 32px;
            border: 1px solid #7a5a1a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background 0.15s;
            background: transparent;
        }
        .cell:hover {
            background: rgba(255, 255, 200, 0.15);
        }
        /* 棋子 */
        .b, .w {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .b {
            background: radial-gradient(circle at 35% 35%, #555, #1a1a1a 60%, #000);
            border: 1px solid #222;
        }
        .w {
            background: radial-gradient(circle at 35% 35%, #fff, #ddd 60%, #bbb);
            border: 1px solid #999;
        }
        .b:hover, .w:hover {
            transform: scale(1.08);
            box-shadow: 2px 2px 12px rgba(0,0,0,0.6);
        }

        /* ========== 按钮组 ========== */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 9px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.45);
            filter: brightness(1.1);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.3);
        }
        .btn-danger:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.45);
        }
        .btn-warning {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            box-shadow: 0 4px 12px rgba(247, 151, 30, 0.3);
            color: #3a2a00;
        }
        .btn-warning:hover {
            box-shadow: 0 6px 20px rgba(247, 151, 30, 0.45);
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            box-shadow: 0 4px 12px rgba(56, 239, 125, 0.3);
        }
        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.45);
        }

        /* ========== 记录 & 存档容器 ========== */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .list-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: background 0.3s;
        }
        .list-section:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .list-section h3 {
            font-size: 15px;
            color: #b0b0d0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .list-section h3::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            border-radius: 2px;
            background: linear-gradient(180deg, #f7971e, #ffd200);
        }
        #record-list, #save-list {
            min-height: 40px;
            font-size: 14px;
            color: #c0c0d8;
            line-height: 1.8;
        }
        #record-list p, #save-list p {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        #record-list p:last-child, #save-list p:last-child {
            border-bottom: none;
        }
        #record-list .btn, #save-list .btn {
            padding: 4px 14px;
            font-size: 12px;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
            }
            .board {
                grid-template-columns: repeat(15, 26px);
                padding: 6px;
            }
            .cell {
                width: 26px;
                height: 26px;
            }
            .b, .w {
                width: 20px;
                height: 20px;
            }
            h1 {
                font-size: 24px;
                letter-spacing: 4px;
            }
            .btn {
                padding: 7px 14px;
                font-size: 13px;
            }
            .players input {
                width: 90px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部：标题 + 用户信息 + 退出按钮 -->
    <div class="header">
        <div></div>
        <h1 th:text="${projectName}"></h1>
        <div class="user-info">
            <span id="loginUser"></span>
            <button class="logout-btn" id="logoutBtn">退出</button>
        </div>
    </div>

    <div class="info-bar">
        <p>当前回合：<span id="current"></span></p>
        <p id="winner" style="color:red;font-weight:bold;"></p>
    </div>

    <div class="players">
        <label>⚫ 黑棋 <input id="p1" value="玩家1"></label>
        <label>⚪ 白棋 <input id="p2" value="玩家2"></label>
    </div>

    <!-- 五子棋棋盘 -->
    <div class="board-wrapper">
        <div id="board" class="board">
            <th:block th:each="row,r:${chessBoard}">
                <th:block th:each="col,c:${row}">
                    <div class="cell" th:data-row="${r.index}" th:data-col="${c.index}">
                        <div th:if="${chessBoard[r.index][c.index] == 1}" class="b"></div>
                        <div th:if="${chessBoard[r.index][c.index] == 2}" class="w"></div>
                    </div>
                </th:block>
            </th:block>
        </div>
    </div>

    <!-- 功能按钮 -->
    <div class="btn-group">
        <button class="btn btn-warning" id="reset">🔄 重置游戏</button>
        <button class="btn btn-success" id="save">💾 保存记录</button>
        <button class="btn" id="update">✏️ 修改记录</button>
        <button class="btn btn-danger" id="delete">🗑️ 删除记录</button>
        <button class="btn" id="saveBtn">📁 保存存档</button>
    </div>

    <!-- 胜负记录 & 存档列表 -->
    <div class="list-container">
        <div class="list-section">
            <h3>胜负记录</h3>
            <div id="record-list">暂无记录</div>
        </div>
        <div class="list-section">
            <h3>游戏存档</h3>
            <div id="save-list">暂无存档</div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const BOARD_SIZE = /*[[${boardSize}]]*/ 15;
    let state = null;
    let recordList = [];

// ========== 修复后的登录检查 ==========
function checkLogin() {
    let userStr = localStorage.getItem("user");

    // 安全检查：如果没有值，或者值是 "undefined"，直接跳转登录页
    if (!userStr || userStr === "undefined") {
        alert("请先登录！");
        window.location.href = "/login.html";
        return false;
    }

    try {
        // 尝试解析 JSON，加 try-catch 防止报错
        let userObj = JSON.parse(userStr);
        // 显示登录用户名
        let loginUserDom = document.getElementById("loginUser");
        if (loginUserDom) {
            loginUserDom.innerText = "欢迎：" + (userObj.username || "用户");
        }
        return true;
    } catch (e) {
        // 如果解析失败，清空 localStorage，跳转登录页
        console.error("用户信息解析失败", e);
        localStorage.removeItem("user");
        localStorage.removeItem("token");
        alert("登录信息异常，请重新登录！");
        window.location.href = "/login.html";
        return false;
    }
}

    // ========== 新增：退出登录 ==========
    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        alert("退出成功！");
        window.location.href = "/login.html";
    }

    // 初始化
    async function init(){
        // 先检查登录
        if (!checkLogin()) return;

        // 绑定退出按钮事件
        document.getElementById("logoutBtn").onclick = logout;

        await refreshState();
        await loadRecords();
        await loadSaveList();
        bindEvents();
    }

    // 刷新游戏状态
    async function refreshState(){
        let res = await fetch("/api/game/state");
        state = await res.json();
        render();
    }

    // 渲染棋盘
    function render(){
        document.querySelectorAll(".cell").forEach(cell=>{
            let r = cell.dataset.row, c = cell.dataset.col;
            let old = cell.querySelector(".b, .w");
            if(old) old.remove();
            if(state.board[r][c]){
                let div = document.createElement("div");
                div.className = state.board[r][c]==1?"b":"w";
                cell.appendChild(div);
            }
        });
        document.getElementById("current").innerText = state.currentPlayer==1?"黑棋":"白棋";
        document.getElementById("winner").innerText = state.gameOver?state.winner+"获胜！":"";
    }

    // 加载胜负记录
    async function loadRecords(){
        let res = await fetch("/api/record");
        recordList = await res.json();
        let dom = document.getElementById("record-list");
        dom.innerHTML = recordList.length===0?"暂无记录":"";
        recordList.forEach(i=>{
            dom.innerHTML += `<p>🏅 ID:${i.id} | ${i.player1} vs ${i.player2} | 胜者:${i.winner}</p>`;
        });
    }

    // 绑定所有事件
    function bindEvents(){
        // 落子事件
        document.querySelectorAll(".cell").forEach(cell=>{
            cell.onclick = async ()=>{
                if(state.gameOver) return;
                let r = cell.dataset.row, c = cell.dataset.col;
                await fetch(`/api/game/move?row=${r}&col=${c}`,{method:"POST"});
                await refreshState();
            }
        });

        // 重置游戏
        document.getElementById("reset").onclick = async ()=>{
            await fetch("/api/game/reset",{method:"POST"});
            await refreshState();
        };

        // 保存胜负记录
        document.getElementById("save").onclick = async ()=>{
            if(!state.gameOver){alert("请先完成游戏！");return;}
            let data = {
                winner:state.winner,
                player1:document.getElementById("p1").value,
                player2:document.getElementById("p2").value
            };
            await fetch("/api/record",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify(data)
            });
            await loadRecords();
            alert("保存成功！");
        };

        // 修改最后一条记录
        document.getElementById("update").onclick = async ()=>{
            if(recordList.length===0){alert("暂无记录可修改！");return;}
            let id = recordList[recordList.length-1].id;
            let data = {
                winner:state.winner||"黑棋",
                player1:document.getElementById("p1").value,
                player2:document.getElementById("p2").value
            };
            await fetch(`/api/record/${id}`,{
                method:"PUT",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify(data)
            });
            await loadRecords();
            alert("修改成功！");
        };

        // 删除最后一条记录
        document.getElementById("delete").onclick = async ()=>{
            if(recordList.length===0){alert("暂无记录可删除！");return;}
            let id = recordList[recordList.length-1].id;
            await fetch(`/api/record/${id}`,{method:"DELETE"});
            await loadRecords();
            alert("删除成功！");
        };

        // 保存游戏存档
        document.getElementById("saveBtn").onclick = async ()=>{
            let name = prompt("请输入存档名称");
            if(!name) return;
            let res = await fetch(`/api/save/create?saveName=${name}`,{method:"POST"});
            alert(await res.text());
            await loadSaveList();
        };
    }

    // 加载游戏存档列表
    async function loadSaveList(){
        try {
            let list = await fetch("/api/save/list");
            let data = await list.json();
            let dom = document.getElementById("save-list");
            dom.innerHTML = data.length===0 ? "暂无存档" : "";
            data.forEach(item=>{
                dom.innerHTML += `<p>📦 ID:${item.id} - ${item.saveName}
                    <button class="btn" onclick="loadGame(${item.id})">加载</button></p>`;
            });
        } catch (e) {
            document.getElementById("save-list").innerText = "加载存档失败";
        }
    }

    // 加载指定存档
    async function loadGame(id){
        let res = await fetch(`/api/save/load/${id}`);
        alert(await res.text());
        location.reload();
    }

    // 启动项目
    init();
</script>
</body>
</html>
